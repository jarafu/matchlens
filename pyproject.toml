[project]
name = "matchlens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "jinja2", "python-multipart", "sqlalchemy", "psycopg[binary]", "numpy", "scipy", "httpx", "python-dotenv", "argon2-cffi"]

[project.optional-dependencies]
dev = ["pytest", "playwright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
